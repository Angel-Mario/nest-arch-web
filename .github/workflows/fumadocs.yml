name: Fumadocs

on:
  pull_request:
    paths:
      - "apps/fumadocs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "vercel.json"
      - ".github/workflows/fumadocs.yml"
  push:
    branches: [main]
    paths:
      - "apps/fumadocs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "vercel.json"
      - ".github/workflows/fumadocs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Fumadocs types
        run: pnpm --filter fumadocs check-types

      - name: Build Fumadocs
        run: pnpm --filter fumadocs build
